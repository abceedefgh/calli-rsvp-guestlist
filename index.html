<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap">
<title>Calli's Dedication · RSVP</title>
<style>
:root{
  --bg:#fbf1e8; --card:#fffaf6; --ink:#4b3a33; --muted:#8a7468;
  --accent:#9c7230; --accent-ink:#ffffff; --line:#ecd6c2; --soft:#fbe9e2; --warn:#b05a4a;
  --gold:#c9a15a; --panel:rgba(255,250,245,.84);
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#251d1b; --card:#32272a; --ink:#f6e9e1; --muted:#c4afa4;
    --accent:#d4a85a; --accent-ink:#2a1f14; --line:#4d3d38; --soft:#3e2e30; --warn:#e59a88;
    --gold:#d4a85a; --panel:rgba(37,29,27,.8);
  }
  :root:not([data-theme="light"]) canvas#bg{filter:brightness(.5) saturate(.9)}
}
:root[data-theme="dark"]{
  --bg:#251d1b; --card:#32272a; --ink:#f6e9e1; --muted:#c4afa4;
    --accent:#d4a85a; --accent-ink:#2a1f14; --line:#4d3d38; --soft:#3e2e30; --warn:#e59a88;
    --gold:#d4a85a; --panel:rgba(37,29,27,.8);
}
:root[data-theme="dark"] canvas#bg{filter:brightness(.5) saturate(.9)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  line-height:1.5; min-height:100vh;
  display:flex; justify-content:center; padding:28px 16px 48px;
}
main{width:100%; max-width:460px}
canvas#bg{position:fixed; inset:0; width:100%; height:100%; z-index:-1; display:block}
.hero{
  text-align:center; margin-bottom:20px; background:var(--panel);
  border:1px solid var(--line); border-radius:24px; padding:22px 16px 20px;
  -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
  box-shadow:0 6px 24px rgba(150,100,60,.10);
}
.portrait{
  display:block; margin:0 auto 4px; width:min(270px,72%); height:auto;
  filter:drop-shadow(0 8px 16px rgba(110,70,40,.22));
}
h1{
  font-family:var(--serif); font-weight:600; font-size:42px; line-height:1.1;
  margin:8px 0 0; letter-spacing:.3px;
}
.gold-rule{width:72px; height:2px; margin:12px auto; background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.sub{font-family:var(--serif); font-style:italic; font-size:21px; color:var(--accent); margin:0}
.details{margin:14px 0 0; padding:0; list-style:none; color:var(--muted); font-size:15px}
.details li{margin:3px 0}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:22px;
  padding:22px 20px; box-shadow:0 6px 24px rgba(150,100,60,.12);
}
label{display:block; font-weight:600; margin-bottom:8px; font-size:15px}
input[type=text]{
  width:100%; font:inherit; font-size:17px; padding:13px 14px;
  border:1px solid var(--line); border-radius:12px; background:var(--bg); color:var(--ink);
}
input[type=text]:focus{outline:2px solid var(--gold); outline-offset:1px}
.hint{color:var(--muted); font-size:13px; margin:8px 0 0}
button,.btn{
  font:inherit; font-weight:600; cursor:pointer; text-decoration:none; text-align:center;
  display:block; width:100%; margin-top:14px; padding:13px 16px; border-radius:999px;
  border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink);
}
button.secondary,.btn.secondary{background:transparent; color:var(--ink); border-color:var(--line)}
button:disabled{opacity:.5; cursor:default}
.result{margin-top:18px}
.msg{color:var(--warn); margin:0; font-size:15px}
.hello{font-family:var(--serif); font-weight:600; font-size:30px; margin:0 0 4px; text-align:center}
.count-wrap{text-align:center; background:var(--soft); border-radius:16px; padding:18px 12px; margin:14px 0 4px; border:1px solid var(--line)}
.count{font-family:var(--serif); font-weight:600; font-size:64px; line-height:1; margin:0; color:var(--accent)}
.count-label{color:var(--muted); font-size:14px; margin:6px 0 0}
.pick{text-align:left; background:var(--bg); color:var(--ink); border:1px solid var(--line); font-weight:500; margin-top:8px; border-radius:14px}
.choices{display:flex; gap:10px}
.choices button{margin-top:10px}
.choices button.on{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.choices button.off{background:transparent; color:var(--ink); border-color:var(--line)}
.stepper{display:flex; align-items:center; justify-content:center; gap:18px; margin-top:12px}
.stepper button{width:44px; margin:0; padding:8px 0; font-size:20px}
.stepper span{font-size:22px; font-family:var(--serif); min-width:90px; text-align:center}
.rsvp h3{margin:22px 0 0; font-family:var(--serif); font-weight:600; font-size:22px; text-align:center}
.foot{text-align:center; color:var(--muted); font-size:13px; margin-top:22px; background:var(--panel); border-radius:14px; padding:10px 14px}
.foot:empty{display:none}
[hidden]{display:none !important}
</style>
</head>

const STOP = new Set(["the","family","fam","and","mr","mrs","ms","dr"]);
const PARTICLES = new Set(["de","del","dela","la","van","von","da","di"]);
function norm(s){
  return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim();
}
function tokens(s){ return norm(s).split(" ").filter(t => t && !STOP.has(t)); }

function find(query){
  const q = tokens(query);
  const qs = q.filter(t => !PARTICLES.has(t));
  if(!q.length) return [];
  const exact = [], partial = [];
  for(const g of GUESTS){
    const labels = [g.name, ...(g.aliases||[]), ...(g.also||[])];
    let isExact = false, isPartial = false;
    for(const l of labels){
      const lt = tokens(l);
      if(lt.length < 2) continue;   // one-word names (no surname) are not searchable
      if(lt.join(" ") === q.join(" ")) isExact = true;
      if(qs.length >= 2 && q.every(t => lt.includes(t))) isPartial = true;
    }
    if(isExact) exact.push(g); else if(isPartial) partial.push(g);
  }
  return exact.length ? exact : partial;
}

const $ = id => document.getElementById(id);
const resultEl = $("result");

// Event details
(function(){
  const ul = $("details");
  [["📅", EVENT.date], ["🕐", EVENT.time], ["📍", EVENT.place]].forEach(([icon, v]) => {
    if(!v) return;
    const li = document.createElement("li");
    li.textContent = v;
    ul.appendChild(li);
  });
  if(EVENT.note) $("foot").textContent = EVENT.note;
})();

function el(tag, cls, text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text != null) e.textContent = text;
  return e;
}

function showMessage(text){
  resultEl.replaceChildren(el("p","msg",text));
}

function showChoices(list){
  resultEl.replaceChildren();
  resultEl.appendChild(el("p","hint","A few invitations match. Which one is yours?"));
  list.forEach(g => {
    const b = el("button","pick",g.name);
    b.type = "button";
    b.addEventListener("click", () => showGuest(g));
    resultEl.appendChild(b);
  });
}

function showGuest(g, typed){
  resultEl.replaceChildren();
  resultEl.appendChild(el("p","hello","Welcome!"));
  const members = g.family ? g.aliases : [g.name, ...g.aliases];
  if(members.length === g.count){
    const who = el("p","hint","Reserved for: " + members.join(", "));
    who.style.textAlign = "center";
    resultEl.appendChild(who);
  }

  const wrap = el("div","count-wrap");
  wrap.appendChild(el("p","count",String(g.count)));
  wrap.appendChild(el("p","count-label",
    (g.count === 1 ? "seat is" : "seats are") + " reserved for you (including yourself)"));
  resultEl.appendChild(wrap);

  if(FORM_URL) buildForm(g, typed);
  else if(CONTACT.sms || CONTACT.email) buildRsvp(g);
}

function buildForm(g, typed){
  const box = el("div","rsvp");
  box.appendChild(el("h3",null,"Please confirm your RSVP"));
  const a = el("a","btn","Confirm your RSVP");
  a.href = FORM_ENTRY
    ? FORM_URL + "?usp=pp_url&" + FORM_ENTRY + "=" + encodeURIComponent(typed || g.name)
    : FORM_URL;
  a.target = "_blank";
  a.rel = "noopener";
  box.appendChild(a);
  resultEl.appendChild(box);
}

function buildRsvp(g){
  const box = el("div","rsvp");
  box.appendChild(el("h3",null,"Let us know if you're coming"));

  const choices = el("div","choices");
  const yes = el("button","off","We'll be there"); yes.type = "button";
  const no  = el("button","off","Can't make it");  no.type = "button";
  choices.append(yes, no);
  box.appendChild(choices);

  const stepper = el("div","stepper"); stepper.hidden = true;
  const minus = el("button","secondary","−"); minus.type = "button";
  const plus  = el("button","secondary","+"); plus.type = "button";
  const num = el("span");
  stepper.append(minus, num, plus);
  box.appendChild(stepper);

  const links = el("div"); links.hidden = true;
  box.appendChild(links);

  let attending = null, n = g.count;

  function update(){
    yes.className = attending === true  ? "on" : "off";
    no.className  = attending === false ? "on" : "off";
    stepper.hidden = attending !== true;
    links.hidden = attending === null;
    num.textContent = n + (n === 1 ? " guest" : " guests");
    minus.disabled = n <= 1;
    plus.disabled = n >= g.count;

    const body = attending
      ? "RSVP for Calli's dedication: " + g.name + " - attending with " + n + " of " + g.count + " seats."
      : "RSVP for Calli's dedication: " + g.name + " - unable to attend.";
    links.replaceChildren();
    if(CONTACT.sms){
      const a = el("a","btn","Send by text message");
      a.href = "sms:" + CONTACT.sms + "?&body=" + encodeURIComponent(body);
      links.appendChild(a);
    }
    if(CONTACT.email){
      const a = el("a","btn" + (CONTACT.sms ? " secondary" : ""),"Send by email");
      a.href = "mailto:" + CONTACT.email + "?subject=" + encodeURIComponent("RSVP: " + g.name) +
               "&body=" + encodeURIComponent(body);
      links.appendChild(a);
    }
  }
  yes.addEventListener("click", () => { attending = true; update(); });
  no.addEventListener("click",  () => { attending = false; update(); });
  minus.addEventListener("click", () => { if(n > 1){ n--; update(); } });
  plus.addEventListener("click",  () => { if(n < g.count){ n++; update(); } });
  update();
  links.hidden = true;
  resultEl.appendChild(box);
}

function search(){
  const v = $("name").value.trim();
  if(!v){ showMessage("Please type your name above."); return; }
  const matches = find(v);
  if(matches.length === 1) return showGuest(matches[0], v);
  if(matches.length > 1)  return showChoices(matches);
  const single = tokens(v).length < 2;
  showMessage(single
    ? "Please enter your first and last name."
    : "We couldn't find that name. Check the spelling or try the name on your invitation.");
}
$("go").addEventListener("click", search);
$("name").addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); search(); } });

/* ---- Soft watercolor flower background (drawn in the browser, no image files) ---- */
(function(){
  const cv = document.getElementById("bg");
  if(!cv || !cv.getContext) return;
  const ctx = cv.getContext("2d");
  function rng(seed){
    let s = seed >>> 0;
    return function(){
      s = (s + 0x6D2B79F5) >>> 0;
      let t = s;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const PINKS = [[348,62,86],[352,55,90],[340,50,84],[12,62,86],[356,58,88]];
  const ANCHORS = [[.06,.10,.10],[.50,.03,.07],[.93,.08,.12],[.04,.45,.08],[.96,.50,.09],
                   [.07,.88,.12],[.45,.97,.09],[.92,.93,.12],[.25,.02,.06],[.75,.99,.07]];

  function paint(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const W = window.innerWidth, H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const R = rng(20261205);
    const rnd = (a, b) => a + (b - a) * R();
    const pick = arr => arr[Math.floor(R() * arr.length)];
    const hsl = (h, s, l, a) => "hsla(" + Math.round(h) + "," + Math.round(s) + "%," + Math.round(l) + "%," + a + ")";
    const U = Math.min(W, H);

    function brush(x, y, len, wid, ang, h, s, l, a){
      ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.lineCap = "round";
      ctx.fillStyle = hsl(h, s, l, a * 0.6);
      ctx.beginPath(); ctx.ellipse(0, 0, len / 2, wid / 2, 0, 0, Math.PI * 2); ctx.fill();
      const n = Math.max(3, Math.round(wid / 3.5));
      for(let i = 0; i < n; i++){
        const off = (i / (n - 1) - 0.5) * wid * 0.9;
        const k = Math.max(0, 1 - Math.abs(off) / (wid * 0.55));
        ctx.strokeStyle = hsl(h + rnd(-4, 4), s + rnd(-6, 6), l + rnd(-5, 5), a * rnd(.3, .65));
        ctx.lineWidth = rnd(1, 2.2);
        ctx.beginPath();
        ctx.moveTo(-len / 2 * k, off);
        ctx.quadraticCurveTo(0, off + rnd(-wid * .12, wid * .12), len / 2 * k, off + rnd(-wid * .08, wid * .08));
        ctx.stroke();
      }
      ctx.restore();
    }

    // cream-to-blush wash
    const g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, "#fdf5ed"); g.addColorStop(1, "#f8e5db");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    const wash = Math.round(W * H / 3200);
    for(let i = 0; i < wash; i++){
      const t = R();
      const col = t < .4 ? [18, 45, 90] : t < .7 ? [350, 40, 91] : t < .85 ? [90, 20, 80] : [38, 50, 86];
      brush(rnd(0, W), rnd(0, H), rnd(.07, .18) * U, rnd(.02, .05) * U, rnd(-1.2, 1.2), col[0], col[1], col[2], .35);
    }

    function leaf(x, y, len, wid, ang){
      brush(x, y, len, wid, ang, rnd(82, 104), rnd(16, 28), rnd(52, 64), .7);
    }

    function blossom(cx, cy, r){
      const c = pick(PINKS);
      for(let i = 0; i < 3 + Math.floor(R() * 3); i++){
        const a = rnd(0, Math.PI * 2), d = r * rnd(1.0, 1.5);
        leaf(cx + Math.cos(a) * d, cy + Math.sin(a) * d, r * rnd(1.1, 1.6), r * rnd(.4, .55), a + rnd(-.3, .3));
      }
      const rot = rnd(0, Math.PI * 2);
      for(let i = 0; i < 5; i++){
        const a = rot + i * (Math.PI * 2 / 5) + rnd(-.08, .08), d = r * .5;
        const lit = c[2] + Math.cos(a - 5 * Math.PI / 4) * 4;
        brush(cx + Math.cos(a) * d, cy + Math.sin(a) * d, r * .98, r * .88, a, c[0] + rnd(-5, 5), c[1], lit, .85);
      }
      for(let i = 0; i < 5; i++){
        const a = rot + Math.PI / 5 + i * (Math.PI * 2 / 5), d = r * .3;
        brush(cx + Math.cos(a) * d, cy + Math.sin(a) * d, r * .55, r * .4, a, c[0], c[1] + 8, c[2] - 6, .5);
      }
      for(let i = 0; i < 6; i++){
        const a = rnd(0, Math.PI * 2), d = rnd(0, r * .12);
        brush(cx + Math.cos(a) * d, cy + Math.sin(a) * d, r * .16, r * .12, rnd(0, 6.28), rnd(32, 42), rnd(60, 75), rnd(52, 64), .9);
      }
    }

    function daisy(cx, cy, r){
      for(let i = 0; i < 3 + Math.floor(R() * 2); i++){
        const a = rnd(0, Math.PI * 2), d = r * rnd(1.0, 1.4);
        leaf(cx + Math.cos(a) * d, cy + Math.sin(a) * d, r * rnd(1.0, 1.5), r * rnd(.35, .5), a + rnd(-.3, .3));
      }
      const np = 9 + Math.floor(R() * 3), rot = rnd(0, Math.PI * 2);
      for(let i = 0; i < np; i++){
        const a = rot + i * (Math.PI * 2 / np) + rnd(-.06, .06), d = r * .55;
        brush(cx + Math.cos(a) * d, cy + Math.sin(a) * d, r * 1.02, r * .36, a, rnd(36, 46), rnd(30, 45), rnd(94, 98), .95);
      }
      for(let i = 0; i < 8; i++){
        const a = rnd(0, Math.PI * 2), d = rnd(0, r * .14);
        brush(cx + Math.cos(a) * d, cy + Math.sin(a) * d, r * .2, r * .15, rnd(0, 6.28), rnd(34, 44), rnd(65, 80), rnd(55, 66), .95);
      }
    }

    function flower(cx, cy, r){ if(R() < .72) blossom(cx, cy, r); else daisy(cx, cy, r); }

    ANCHORS.forEach(function(an){
      const cx = an[0] * W, cy = an[1] * H, r = an[2] * U * .82;
      flower(cx, cy, r);
      const extra = 2 + Math.floor(R() * 3);
      for(let i = 0; i < extra; i++) flower(cx + rnd(-1.7, 1.7) * r, cy + rnd(-1.7, 1.7) * r, r * rnd(.5, .8));
    });

    // fine paper-like texture
    const tex = Math.round(W * H / 1100);
    for(let i = 0; i < tex; i++){
      brush(rnd(0, W), rnd(0, H), rnd(6, 16), rnd(2, 4), rnd(0, Math.PI), rnd(10, 40), rnd(15, 35), rnd(80, 92), .08);
    }
    ctx.fillStyle = "rgba(255,250,244,.14)"; ctx.fillRect(0, 0, W, H);
  }

  let lastW = 0, lastH = 0, timer;
  function run(){
    lastW = window.innerWidth; lastH = window.innerHeight;
    try { paint(); } catch(e) {}
  }
  run();
  window.addEventListener("resize", function(){
    clearTimeout(timer);
    timer = setTimeout(function(){
      if(window.innerWidth !== lastW || Math.abs(window.innerHeight - lastH) > 150) run();
    }, 250);
  });
})();
</script>
